apiVersion: v1
kind: Pod

metadata:
  name: secret-pod
  namespace: kube-lab

spec:
  containers:
    - name: nginx
      image: nginx:1.27

      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secret-manifest
              key: DB_USERNAME

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret-manifest
              key: DB_PASSWORD
